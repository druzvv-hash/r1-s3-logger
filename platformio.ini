; Run PlatformIO commands from the repository root.
[platformio]
default_envs = esp32-s3
src_dir = firmware/src
include_dir = firmware/include

[env]
platform = espressif32@6.12.0
; ESP32-S3-WROOM-2-N32R16V: 32 MB Octal Flash, 16 MB Octal PSRAM.
; Override the base DevKitC profile's N8 memory settings.
board = esp32-s3-devkitc-1
framework = arduino
; Normal builds contain no EEPROM pattern-write test.
build_src_filter = +<*> -<eeprom_test.cpp>
lib_deps =
    adafruit/Adafruit SH110X@2.1.12
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = dout
board_build.boot = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 32MB
board_build.partitions = large_littlefs_32MB.csv
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; dout is the image-header mode; opi_opi + boot=opi select Octal hardware.

[env:esp32-s3]
; Original UART profile: CP210x on COM5.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
upload_port = COM5
monitor_port = COM5

[env:esp32-s3-usb]
; Native USB Serial/JTAG, matching the previous project's USB flags.
; No fixed COM port: the USB connector enumerates separately from CP210x.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-uart-manual]
extends = env:esp32-s3
; Enter download mode with BOOT + RESET before Upload.
; Press RESET manually after a successful upload.
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

[env:esp32-s3-service]
extends = env:esp32-s3
; Explicit diagnostic build: creates SD files and tests/restores EEPROM.
build_src_filter = +<*>
build_flags = ${env:esp32-s3.build_flags}
    -DR1_SERVICE_TESTS=1

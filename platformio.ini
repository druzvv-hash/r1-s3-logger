; Run PlatformIO commands from the repository root.
[platformio]
default_envs = esp32-s3
src_dir = firmware/src
include_dir = firmware/include

[env:esp32-s3]
platform = espressif32
; Provisional N8 profile: 8 MB Flash, no PSRAM. Confirm actual hardware.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Pin the platform version after the first verified build and hardware test.
